resources:
  jobs:
    enron_pipeline:
      name: "[${bundle.target}] GraphRAG — Enron Knowledge Graph Pipeline"
      tags:
        usage: "solacc"
        domain: "graphrag"
        corpus: "enron"
      timeout_seconds: 28800
      max_concurrent_runs: 1
      tasks:
        - task_key: "00_Intro_and_Config"
          notebook_task:
            notebook_path: ../notebooks/00_Intro_and_Config.py

        - task_key: "06_Enron_Data_Prep"
          notebook_task:
            notebook_path: ../notebooks/06_Enron_Data_Prep.py
          depends_on:
            - task_key: "00_Intro_and_Config"

        - task_key: "07_Enron_Build_Knowledge_Graph"
          notebook_task:
            notebook_path: ../notebooks/07_Enron_Build_Knowledge_Graph.py
          depends_on:
            - task_key: "06_Enron_Data_Prep"

        - task_key: "08_Enron_Evaluation"
          notebook_task:
            notebook_path: ../notebooks/08_Enron_Evaluation.py
          depends_on:
            - task_key: "07_Enron_Build_Knowledge_Graph"

        - task_key: "09_Enron_Genie_Spaces"
          notebook_task:
            notebook_path: ../notebooks/09_Enron_Genie_Spaces.py
          depends_on:
            - task_key: "07_Enron_Build_Knowledge_Graph"

      permissions:
        - level: CAN_VIEW
          group_name: "users"
