resources:
  apps:
    graphrag_webapp:
      name: graphrag-demo-v2-${bundle.target}
      description: "GraphRAG Interactive Demo — Auditable AI powered by Knowledge Graphs on Databricks"
      source_code_path: ../src/app
      resources:
        - name: enron-serving-endpoint
          serving_endpoint:
            name: graphrag-enron-agent
            permission: CAN_QUERY
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
