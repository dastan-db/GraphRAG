[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphframes-mcp-server"
version = "0.1.0"
description = "GraphFrames MCP Server — Graph analytics tools for the GraphRAG agent"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "psycopg[binary]>=3.0",
    "databricks-sdk>=0.81.0",
]

[project.scripts]
graphframes-mcp = "server.main:main"
