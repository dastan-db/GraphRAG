command:
  - "gunicorn"
  - "app:server"
  - "-w"
  - "4"
  - "--timeout"
  - "120"
  - "-b"
  - "0.0.0.0:8000"

env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: GRAPHRAG_ENDPOINT_NAME
    valueFrom: serving-endpoint
  - name: GRAPHRAG_ENRON_ENDPOINT_NAME
    valueFrom: enron-serving-endpoint
  - name: DATABRICKS_CATALOG
    value: "serverless_8e8gyh_catalog"
  - name: DATABRICKS_SCHEMA
    value: "graphrag_bible"
  - name: USE_MOCK_BACKEND
    value: "false"
  - name: LAKEBASE_ENDPOINT
    value: "projects/graphrag/branches/production/endpoints/primary"
  - name: GRAPHRAG_DATA_BACKEND
    value: "lakebase"
  - name: GRAPHRAG_APP_RUNTIME_MODE
    value: "shared"
  - name: GRAPHRAG_RUNTIME_TRANSPORT
    value: "direct"
  - name: GRAPHRAG_ROUTER_TRANSPORT
    value: "local"
  - name: GRAPHRAG_PLANNER_TRANSPORT
    value: "local"
  - name: GRAPHRAG_GRAPH_TRANSPORT
    value: "mcp"
  - name: GRAPHRAG_EVIDENCE_TRANSPORT
    value: "mcp"
  - name: GRAPHRAG_ANALYTICS_TRANSPORT
    value: "mcp"
  - name: GRAPHRAG_NOTEBOOK_PATH
    value: "/Workspace/Users/dastan.aitzhanov@databricks.com/.bundle/graphrag-solution-accelerator/dev/files/notebooks"
