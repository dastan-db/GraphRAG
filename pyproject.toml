[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphrag-solution-accelerator"
version = "0.1.0"
description = "GraphRAG: Graph-powered RAG on Databricks — Bible Knowledge Graph Demo"
requires-python = ">=3.11"
dependencies = [
    "databricks-langchain",
    "langgraph>=0.3.4",
    "mlflow>=3.0",
    "databricks-agents",
    "databricks-sdk>=0.30",
    "pydantic>=2.0",
    "databricks-mcp",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "rich>=13.0",
    "textual>=0.75",
    "tiktoken>=0.7",
]
local = [
    "duckdb>=1.0",
    "langchain-openai>=0.2",
    "langchain-ollama>=0.2",
]
gateway = [
    "litellm[proxy]",
]

[tool.pytest.ini_options]
markers = [
    "integration: end-to-end agent tests requiring LLM credentials (deselect with '-m not integration')",
    "baseline: raw LLM baseline tests (no graph tools) — expected to fail, proving graph engine value",
]
